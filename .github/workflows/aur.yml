# Publishes packaging/aur to the AUR package "frameit".
#
# Required repository secret:
#   AUR_SSH_PRIVATE_KEY  An SSH private key in OpenSSH format without a
#                        passphrase. Its public key must be registered on the
#                        AUR account "eggfriedrice" (My Account -> SSH Public
#                        Key on https://aur.archlinux.org/). Generate one with
#                        ssh-keygen -t ed25519 -f aur -C frameit-ci and paste
#                        the contents of the private file "aur" as the secret.
#
# Triggers:
#   - release published: stable releases whose tag starts with "v".
#     Prereleases are ignored.
#   - workflow_dispatch with the tag to publish. release.yml uses this path,
#     because a release created with GITHUB_TOKEN does not fire the release
#     event for other workflows.
#
# What it does, in an archlinux:base-devel container:
#   1. computes the BLAKE2 checksum of the GitHub tag tarball for the release,
#   2. sets pkgver (tag without v), pkgrel=1 and b2sums in
#      packaging/aur/PKGBUILD and regenerates .SRCINFO,
#   3. test builds the package with makepkg (checksums verified) and namcap,
#   4. pushes PKGBUILD, .SRCINFO and the packaging LICENSE to
#      ssh://aur@aur.archlinux.org/frameit.git with the commit
#      "upgpkg: <version>-1",
#   5. commits the updated packaging/aur files back to master with
#      "[skip ci]" so the push does not start another CI run.
# If the AUR repository already carries that pkgver, the job logs it and
# exits successfully without changing anything.

name: AUR

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to AUR
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      AUR_REPO: ssh://aur@aur.archlinux.org/frameit.git
      BUILD_DIR: /home/builder/frameit
    steps:
      - name: Install tooling
        # git before checkout so the action produces a real git checkout.
        # pacman-contrib provides updpkgsums. The image's keyring may predate
        # a packager key, so it is refreshed before the upgrade.
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed git namcap openssh pacman-contrib rust

      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Resolve tag and version
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${TAG}' is not a stable release tag of the form vX.Y.Z"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "publishing ${TAG} as pkgver ${TAG#v}"

      - name: Set up SSH for aur.archlinux.org
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "::error::secret AUR_SSH_PRIVATE_KEY is not set"
            exit 1
          fi
          ssh_dir="$HOME/.ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/aur"
          chmod 600 "$ssh_dir/aur"
          # Fails early with a clear message if the secret is not a valid key.
          ssh-keygen -y -f "$ssh_dir/aur" > /dev/null

          # Pinned host keys for aur.archlinux.org, taken on 2026-10-01 from
          # docs/ssh-known_hosts.txt in the archlinux/infrastructure repository
          # on gitlab.archlinux.org and from a live ssh-keyscan, which agreed.
          # Their fingerprints match the "SSH Fingerprints" box on
          # https://aur.archlinux.org/:
          #   Ed25519  SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          #   ECDSA    SHA256:uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI
          #   RSA      SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8
          # If the AUR rotates its keys, update these lines from that page.
          cat > "$ssh_dir/aur_known_hosts" <<'KNOWN_HOSTS'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          aur.archlinux.org ssh-rsa 
          KNOWN_HOSTS
          chmod 600 "$ssh_dir/aur_known_hosts"

          # Explicit paths rather than ~/.ssh defaults: inside the container
          # $HOME differs from root's passwd entry, which is what ssh uses.
          echo "GIT_SSH_COMMAND=ssh -i ${ssh_dir}/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=${ssh_dir}/aur_known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Clone AUR repository and compare pkgver
        id: aur
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          aur_dir="$HOME/aur-frameit"
          # A package that does not exist yet clones as an empty repository.
          git clone "$AUR_REPO" "$aur_dir"
          echo "AUR_DIR=${aur_dir}" >> "$GITHUB_ENV"
          current=""
          if [[ -f "$aur_dir/.SRCINFO" ]]; then
            current=$(sed -n 's/^\tpkgver = //p' "$aur_dir/.SRCINFO")
          fi
          echo "AUR currently has pkgver '${current:-none}', releasing '${VERSION}'"
          if [[ "$current" == "$VERSION" ]]; then
            echo "AUR already has frameit ${VERSION}; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create non-root build user
        if: steps.aur.outputs.skip != 'true'
        # makepkg and updpkgsums refuse to run as root.
        run: useradd -m builder

      - name: Update PKGBUILD and .SRCINFO
        if: steps.aur.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/eggfriedrice24/frameit/archive/refs/tags/${TAG}.tar.gz"
          b2=$(curl -fsSL "$url" | b2sum | cut -d ' ' -f 1)
          echo "b2sum of ${url}: ${b2}"

          install -d -o builder -g builder "$BUILD_DIR"
          install -o builder -g builder -m 644 packaging/aur/PKGBUILD "$BUILD_DIR/PKGBUILD"
          sed -i \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            "$BUILD_DIR/PKGBUILD"

          # updpkgsums downloads the sources named in the PKGBUILD and rewrites
          # the checksum arrays in place. The downloaded tarball stays next to
          # the PKGBUILD, so the test build below does not fetch it again.
          su - builder -c "cd '$BUILD_DIR' && updpkgsums"
          if ! grep -q "$b2" "$BUILD_DIR/PKGBUILD"; then
            echo "::error::PKGBUILD b2sums do not contain the checksum of ${url}; check the source= line"
            exit 1
          fi
          su - builder -c "cd '$BUILD_DIR' && makepkg --printsrcinfo > .SRCINFO"

          echo "::group::PKGBUILD changes"
          diff -u packaging/aur/PKGBUILD "$BUILD_DIR/PKGBUILD" || true
          echo "::endgroup::"

      - name: Test build and namcap
        if: steps.aur.outputs.skip != 'true'
        run: |
          set -euo pipefail
          su - builder -c "cd '$BUILD_DIR' && makepkg -f"
          log=$(mktemp)
          # The glob matches the main package and not the -debug split.
          for target in "$BUILD_DIR/PKGBUILD" "$BUILD_DIR"/frameit-[0-9]*.pkg.tar.zst; do
            echo "::group::namcap $target"
            namcap "$target" | tee -a "$log"
            echo "::endgroup::"
          done
          if grep -E '^[^ ]+( \([^)]*\))? E: ' "$log"; then
            echo "::error::namcap reported errors (warnings above are informational)"
            exit 1
          fi
          echo "namcap reported no errors"

      - name: Push to AUR
        if: steps.aur.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$AUR_DIR"
          cp "$BUILD_DIR/PKGBUILD" "$BUILD_DIR/.SRCINFO" .
          cp "$GITHUB_WORKSPACE/packaging/aur/LICENSE" .
          git config user.name "eggfriedrice"
          git config user.email "eggfriedricew.g.o@gmail.com"
          git add PKGBUILD .SRCINFO LICENSE
          if git diff --cached --quiet; then
            echo "AUR repository already matches; nothing to push"
            exit 0
          fi
          git commit -m "upgpkg: ${VERSION}-1"
          git push origin HEAD:master

      - name: Commit packaging update to master
        if: steps.aur.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Needed by both the commit and the rebase below; a -c on the commit
          # alone leaves the rebase without a committer identity.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp "$BUILD_DIR/PKGBUILD" "$BUILD_DIR/.SRCINFO" packaging/aur/
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          if git diff --cached --quiet; then
            echo "packaging/aur already up to date"
            exit 0
          fi
          git commit -m "update aur packaging to ${VERSION} [skip ci]"
          # master may have moved while the package was building.
          git pull --rebase origin master
          git push origin HEAD:master
